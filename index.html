<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#e8b77c">
  <title>Screwdom — Bagan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="မြန်မာပုဂံပုံစံ 3D ဝက်အူပဟေဠိ"></canvas>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">✺</div><div><strong>SCREWDOM</strong><span>BAGAN · MYANMAR</span></div></div>
    <div class="stats">
      <div class="stat"><span>အဆင့်</span><strong>၀၁</strong></div>
      <div class="stat"><span>ကျန်ဝက်အူ</span><strong id="remaining">၁၈</strong></div>
      <div class="stat"><span>ရွှေ့မှု</span><strong id="moves">၀</strong></div>
    </div>
  </header>
  <main class="game-copy">
    <p class="eyebrow">BAGAN SCREW PUZZLE</p>
    <h1>ပုဂံရဲ့ <em>ရွှေဝက်အူများ</em></h1>
    <p>ပေါ်နေတဲ့ဝက်အူကိုနှိပ်ပြီး အောက်ကနေရာ ၃ ခုထဲ ရွှေ့ပါ။<br>အရောင်တူ ၃ ခုစီ စုပြီး ရှင်းလင်းလိုက်ပါ။</p>
  </main>
  <div class="bottom-bar">
    <div class="hint"><span class="hint-dot"></span> အပေါ်ဆုံးဝက်အူကိုသာ ရွေးလို့ရပါတယ်</div>
    <button id="restart" class="restart" type="button" aria-label="ပြန်စမည်">↻ <span>ပြန်စမည်</span></button>
  </div>
  <section id="result" class="result hidden" aria-live="polite">
    <div class="result-card">
      <span class="result-symbol" id="result-symbol">✦</span>
      <p class="eyebrow">BAGAN · LEVEL 01</p>
      <h2 id="result-title">ပြီးပါပြီ</h2>
      <p id="result-copy"></p>
      <button id="play-again" type="button">ထပ်ကစားမယ် <span>↻</span></button>
    </div>
  </section>
  <script src="game.js"></script>
</body>
</html>
